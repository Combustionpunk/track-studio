# Local run of the production image. Reads settings from .env (see .env.example).
#   docker compose up --build
#   docker compose run --rm track-studio node dist/seed.js     # import reference venues + example tracks
#   docker compose run --rm track-studio node dist/rebake.js   # after an engine update: refresh every stored built
services:
  track-studio:
    build: .
    image: track-studio:local
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data          # inside the container; the volume below
      DEV_LOGIN: "0"           # never in the production image
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - track-studio-data:/data
    restart: unless-stopped

volumes:
  track-studio-data:

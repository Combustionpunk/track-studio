<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone designer · plan and toolbar</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<!-- Track Studio phone designer mockup (#117). Static HTML/CSS; colours are the tokens in ../tokens.json by custom
     property (see phone.css), icons are Lucide (data-lucide gives the name), the plan is a hand-drawn approximation in
     metres (origin at the centre of the track area, +x east, +z north). Open at 375 px wide. -->

<div class="phone">
  
  <header class="top">
    <a href="../mockups/Track375.dc.html" class="icon-btn" aria-label="Back to track"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="chevron-left"><path d="m15 18-6-6 6-6"/></svg></a>
    <span class="name">Winter Carpet Layout 3</span>
    <span class="state">Saved</span>
    <button type="button" class="icon-btn" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="ellipsis"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
  </header>
  <main class="stage" aria-label="Plan">
    <svg class="plan" viewBox="-11.6 -21.53 23.2 43.059" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plan being edited" xmlns="http://www.w3.org/2000/svg">
<defs><pattern id="chequer" width="0.3" height="0.3" patternUnits="userSpaceOnUse"><rect width="0.15" height="0.15" fill="var(--plan-pipe)"/><rect x="0.15" y="0.15" width="0.15" height="0.15" fill="var(--plan-pipe)"/><rect x="0.15" width="0.15" height="0.15" fill="var(--plan-floor)"/><rect y="0.15" width="0.15" height="0.15" fill="var(--plan-floor)"/></pattern>
<pattern id="hatch" width="0.5" height="0.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="0.5" height="0.5" fill="var(--plan-rostrum)"/><rect width="0.12" height="0.5" fill="var(--plan-area)"/></pattern></defs>
<rect x="-11" y="-6" width="22" height="12" fill="var(--plan-area)"/>
<line x1="-11" y1="-6" x2="-11" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-10" y1="-6" x2="-10" y2="6" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="-9" y1="-6" x2="-9" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-8" y1="-6" x2="-8" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-7" y1="-6" x2="-7" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-6" y1="-6" x2="-6" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-5" y1="-6" x2="-5" y2="6" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="-4" y1="-6" x2="-4" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-3" y1="-6" x2="-3" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-2" y1="-6" x2="-2" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-1" y1="-6" x2="-1" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="0" y1="-6" x2="0" y2="6" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="1" y1="-6" x2="1" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="2" y1="-6" x2="2" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="3" y1="-6" x2="3" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="4" y1="-6" x2="4" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="5" y1="-6" x2="5" y2="6" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="6" y1="-6" x2="6" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="7" y1="-6" x2="7" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="8" y1="-6" x2="8" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="9" y1="-6" x2="9" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="10" y1="-6" x2="10" y2="6" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="11" y1="-6" x2="11" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="6" x2="11" y2="6" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="5" x2="11" y2="5" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="-11" y1="4" x2="11" y2="4" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="3" x2="11" y2="3" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="2" x2="11" y2="2" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="1" x2="11" y2="1" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="0" x2="11" y2="0" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="-11" y1="-1" x2="11" y2="-1" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="-2" x2="11" y2="-2" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="-3" x2="11" y2="-3" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="-4" x2="11" y2="-4" stroke="var(--plan-grid)" stroke-width="0.062"/><line x1="-11" y1="-5" x2="11" y2="-5" stroke="var(--plan-grid-major)" stroke-width="0.062"/><line x1="-11" y1="-6" x2="11" y2="-6" stroke="var(--plan-grid)" stroke-width="0.062"/>
<rect x="-3" y="-6" width="6" height="0.8" fill="url(#hatch)" stroke="var(--plan-rostrum)" stroke-width="0.05"/>
<rect x="-6.3" y="1.7" width="0.6" height="0.6" fill="var(--plan-obstacle)"/>
<path d="M-9 5 L5 5 L5 1 L9 1 L9 -5 L3 -5 L3 -1 L-1 -1 L-1 -5 L-9 -5 Z" fill="none" stroke="var(--plan-pipe)" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M-9 5 L5 5 L5 1 L9 1 L9 -5 L3 -5 L3 -1 L-1 -1 L-1 -5 L-9 -5 Z" fill="none" stroke="var(--plan-carpet)" stroke-width="2" stroke-linejoin="round"/>
<g><rect x="8.2" y="-3" width="1.6" height="2" fill="var(--plan-jump)" stroke="var(--plan-jump-edge)" stroke-width="0.06"/><line x1="8.2" y1="-1" x2="9.8" y2="-1" stroke="var(--plan-jump-edge)" stroke-width="0.14"/></g>
<g><rect x="-7" y="-5.8" width="1.2" height="1.6" fill="var(--plan-jump)" stroke="var(--plan-jump-edge)" stroke-width="0.06"/><line x1="-5.8" y1="-5.8" x2="-5.8" y2="-4.2" stroke="var(--plan-jump-edge)" stroke-width="0.14"/><rect x="-5.2" y="-5.8" width="1.2" height="1.6" fill="var(--plan-jump)" stroke="var(--plan-jump-edge)" stroke-width="0.06"/><line x1="-4" y1="-5.8" x2="-4" y2="-4.2" stroke="var(--plan-jump-edge)" stroke-width="0.14"/></g>
<rect x="-2.15" y="4" width="0.3" height="2" fill="url(#chequer)"/>
<path d="M-9 5 L5 5 L5 1 L9 1 L9 -5 L3 -5 L3 -1 L-1 -1 L-1 -5 L-9 -5 Z" fill="none" stroke="var(--plan-line)" stroke-width="0.093" stroke-dasharray="0.4 0.3" stroke-linejoin="round"/>
<g class="corner"><circle cx="-9" cy="5" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="-9" y="5" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">1</text></g><g class="corner"><circle cx="5" cy="5" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="5" y="5" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">2</text></g><g class="corner"><circle cx="5" cy="1" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="5" y="1" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">3</text></g><g class="corner"><circle cx="9" cy="1" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="9" y="1" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">4</text></g><g class="corner"><circle cx="9" cy="-5" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="9" y="-5" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">5</text></g><g class="corner"><circle cx="3" cy="-5" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="3" y="-5" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">6</text></g><g class="corner"><circle cx="3" cy="-1" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="3" y="-1" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">7</text></g><g class="corner"><circle cx="-1" cy="-1" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="-1" y="-1" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">8</text></g><g class="corner"><circle cx="-1" cy="-5" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="-1" y="-5" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">9</text></g><g class="corner"><circle cx="-9" cy="-5" r="0.804" fill="var(--bg-sunken)" stroke="var(--text)" stroke-width="0.093"/><text x="-9" y="-5" text-anchor="middle" dominant-baseline="central" font-size="0.742" font-weight="600" fill="var(--text)">10</text></g></svg>
    <div class="hint" aria-live="polite">Tap a corner to select it. Pinch to zoom, two fingers to pan.</div>
    <button type="button" class="pill pill-ok" aria-expanded="false"><svg class="lucide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="circle-check"><circle cx="12" cy="12" r="10"/><path d="m16 9-5.5 5.5L8 12"/></svg>No problems</button>
    <div class="scalebar" style="width: 80.8189655172414px">5 m</div>
  </main>
  
  <nav class="toolbar" role="toolbar" aria-label="Designer tools">
    <button type="button" class="tool" aria-pressed="true"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="mouse-pointer-2"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg><span>Select</span></button>
    <button type="button" class="tool" aria-pressed="false"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span>Add point</span></button>
    <button type="button" class="tool" aria-pressed="false"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="layout-grid"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg><span>Jump</span></button>
    <button type="button" class="tool" disabled><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="trash-2"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Delete</span></button>
    <button type="button" class="tool"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="undo-2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg><span>Undo</span></button>
    <button type="button" class="tool" disabled><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="redo-2"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg><span>Redo</span></button>
    <button type="button" class="tool" aria-pressed="false"><svg class="lucide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-lucide="box"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>3D</span></button>
  </nav>
</div>
<p class="note">Stage 1, opened from the track page. The plan is the whole screen between a slim header and the toolbar; the checks pill opens the Checks sheet; ⋯ opens the overflow menu.</p>
</body>
</html>

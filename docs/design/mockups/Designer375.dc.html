<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Designer on a phone</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Oswald:wght@500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 375px; height: 812px; box-sizing: border-box; background: #3d4147; color: #d9d9d9; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 22px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #36393e; border-bottom: 1px solid #54585d">
    <a href="Track375.dc.html" aria-label="Back to track" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 6px; color: #d9d9d9">[chevron-left]</a>
    <span style="font: 500 19px Oswald, 'Arial Narrow', sans-serif">Winter Carpet Layout 3</span>
  </header>
  <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; justify-items: center; gap: 12px; padding: 28px 20px; text-align: center; border: 1px dashed #939597; border-radius: 10px">
      <span style="color: #fdd459">[monitor, 36px]</span>
      <h1 style="margin: 0; font-family: Oswald, sans-serif; font-weight: 500; font-size: 22px; line-height: 28px">Design on a laptop or tablet</h1>
      <p style="margin: 0; color: #bebfc1; max-width: 32ch">The designer needs a bigger screen. You can look at the plan here, and pick up where you left off on a laptop or tablet.</p>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 6px; border: 1px solid #939597; background: transparent; color: #d9d9d9; font: 600 14px Inter, sans-serif">Copy link to this design</button>
    </div>
    <!-- View-only plan, same drawing as Track.dc.html, full width. -->
    <div role="img" aria-label="Plan of Winter Carpet Layout 3, view only" style="aspect-ratio: 240 / 152; border-radius: 10px; background: #2b2e32; border: 1px solid #54585d"></div>
    <div style="display: flex; gap: 20px">
      <div><div style="font-family: Oswald, sans-serif; font-weight: 500; font-size: 18px; line-height: 22px; font-variant-numeric: tabular-nums">38.4 m</div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Lap</div></div>
      <div><div style="font-family: Oswald, sans-serif; font-weight: 500; font-size: 18px; line-height: 22px; font-variant-numeric: tabular-nums">12</div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Corners</div></div>
      <div><div style="font-family: Oswald, sans-serif; font-weight: 500; font-size: 18px; line-height: 22px">Draft</div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Status</div></div>
    </div>
  </main>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Oswald:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#fdd459}a:hover{color:#ffe28a}
</style>
</helmet>
<div style="width: 1200px; height: 980px; box-sizing: border-box; background: #3d4147; color: #d9d9d9; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 22px; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 24px; padding: 12px 24px; background: #36393e; border-bottom: 1px solid #54585d">
    <a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #d9d9d9">
      <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#2b2e32"></rect><path d="M14 18 H44 A10 10 0 0 1 44 38 H34 L28 46 H18 A6 6 0 0 1 12 40 V22 A4 4 0 0 1 14 18 Z" fill="none" stroke="#ecece6" stroke-width="12" stroke-linejoin="round"></path><path d="M14 18 H44 A10 10 0 0 1 44 38 H34 L28 46 H18 A6 6 0 0 1 12 40 V22 A4 4 0 0 1 14 18 Z" fill="none" stroke="#46564c" stroke-width="9" stroke-linejoin="round"></path><path d="M14 18 H44 A10 10 0 0 1 44 38 H34 L28 46 H18 A6 6 0 0 1 12 40 V22 A4 4 0 0 1 14 18 Z" fill="none" stroke="#fdd459" stroke-width="1.6" stroke-dasharray="3 2.4"></path></svg>
      <span style="font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.04em">RC MISFITS <span style="font-weight: 500; color: #fdd459">TRACK STUDIO</span></span>
    </a>
    <nav aria-label="Main" style="display: flex; gap: 4px">
      <a href="#" aria-current="page" style="padding: 8px 12px; color: #fdd459; text-decoration: none; font-weight: 600; font-size: 14px; box-shadow: inset 0 -2px 0 #fdd459">Library</a>
      <a href="#" style="padding: 8px 12px; color: #d9d9d9; text-decoration: none; font-weight: 600; font-size: 14px">Venues</a>
      <a href="#" style="padding: 8px 12px; color: #d9d9d9; text-decoration: none; font-weight: 600; font-size: 14px">New track</a>
    </nav>
    <span style="margin-left: auto; font-size: 13px; color: #bebfc1">Signed in as yeti</span>
  </header>

  <main style="padding: 32px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div>
        <h1 style="margin: 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 500; font-size: 32px; line-height: 38px">Track library</h1>
        <p style="margin: 4px 0 0; color: #bebfc1">24 tracks · 6 venues</p>
      </div>
      <a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 6px; background: #fdd459; color: #272727; text-decoration: none; font-weight: 600; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New track</a>
    </div>

    <form style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 16px; background: #464a50; border: 1px solid #54585d; border-radius: 10px">
      <div style="display: grid; gap: 4px; flex: 1 1 220px">
        <label for="q" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Search</label>
        <input id="q" placeholder="Track name or author" style="height: 36px; padding: 0 12px; border-radius: 4px; border: 1px solid #939597; background: #272727; color: #d9d9d9; font: inherit">
      </div>
      <div style="display: grid; gap: 4px; width: 200px">
        <label for="venue" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Venue</label>
        <select id="venue" style="height: 36px; padding: 0 8px; border-radius: 4px; border: 1px solid #939597; background: #272727; color: #d9d9d9; font: inherit"><option>All venues</option><option>Misfits Main Hall</option></select>
      </div>
      <div style="display: grid; gap: 4px; width: 200px">
        <label for="fits" style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Fits my venue</label>
        <select id="fits" style="height: 36px; padding: 0 8px; border-radius: 4px; border: 1px solid #939597; background: #272727; color: #d9d9d9; font: inherit"><option>Any size</option><option>Village hall 14 × 8 m</option></select>
      </div>
      <div style="display: grid; gap: 4px">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Status</span>
        <div style="display: flex; gap: 8px">
          <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #fdd459; background: #5b5434; color: #fdd459; font: 600 14px Inter, sans-serif">Approved</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #939597; background: transparent; color: #d9d9d9; font: 600 14px Inter, sans-serif">Submitted</button>
          <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #939597; background: transparent; color: #d9d9d9; font: 600 14px Inter, sans-serif">Mine</button>
        </div>
      </div>
    </form>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
      <sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
        <a href="Track.dc.html" style="display: grid; border-radius: 6px; border: 1px solid #54585d; background: #464a50; overflow: hidden; color: inherit; text-decoration: none">
          <svg viewBox="0 0 220 132" role="img" aria-label="Track plan" style="display: block; width: 100%; aspect-ratio: 16 / 9; background: #2b2e32">
            <rect x="0" y="0" width="220" height="120" fill="#33373c"></rect>
            <path d="M20 0V120M40 0V120M60 0V120M80 0V120M100 0V120M120 0V120M140 0V120M160 0V120M180 0V120M200 0V120M0 20H220M0 40H220M0 60H220M0 80H220M0 100H220" stroke="#ffffff1a" stroke-width="1" fill="none"></path>
            <rect x="70" y="122" width="80" height="10" fill="#8a8f96"></rect>
            <path d="{{t.path}}" fill="none" stroke="#ecece6" stroke-width="19" stroke-linejoin="round"></path>
            <path d="{{t.path}}" fill="none" stroke="#46564c" stroke-width="16" stroke-linejoin="round"></path>
            <path d="{{t.path}}" fill="none" stroke="#fdd459" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"></path>
            <rect x="72" y="12" width="7" height="16" rx="1" fill="#e0b16a" stroke="#6b4a1f"></rect>
            <rect x="104" y="12" width="12" height="16" rx="1" fill="#e0b16a" stroke="#6b4a1f"></rect>
          </svg>
          <div style="display: grid; gap: 8px; padding: 12px 16px 16px">
            <div style="display: flex; gap: 8px; justify-content: space-between; align-items: flex-start">
              <h2 style="margin: 0; font-family: Oswald, 'Arial Narrow', sans-serif; font-weight: 500; font-size: 20px; line-height: 24px; color: #d9d9d9">{{t.name}}</h2>
              <sc-if value="{{t.approved}}" hint-placeholder-val="{{true}}"><span style="height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 9999px; border: 1px solid #6fcf97; background: #33503f; color: #6fcf97; font: 600 11px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap">Approved</span></sc-if>
              <sc-if value="{{t.submitted}}" hint-placeholder-val="{{false}}"><span style="height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 9999px; border: 1px solid #fdd459; background: #5b5434; color: #fdd459; font: 600 11px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap">Submitted</span></sc-if>
              <sc-if value="{{t.draft}}" hint-placeholder-val="{{false}}"><span style="height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 9999px; border: 1px solid #939597; color: #bebfc1; font: 600 11px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap">Draft</span></sc-if>
            </div>
            <div style="font-size: 13px; line-height: 18px; color: #bebfc1">{{t.meta}}</div>
            <div style="display: flex; gap: 24px">
              <div><div style="font-family: Oswald, sans-serif; font-weight: 500; font-size: 18px; line-height: 22px; font-variant-numeric: tabular-nums">{{t.lap}}</div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Lap</div></div>
              <div><div style="font-family: Oswald, sans-serif; font-weight: 500; font-size: 18px; line-height: 22px; font-variant-numeric: tabular-nums">{{t.corners}}</div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Corners</div></div>
              <div><div style="font-family: Oswald, sans-serif; font-weight: 500; font-size: 18px; line-height: 22px; font-variant-numeric: tabular-nums">{{t.size}}</div><div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #bebfc1">Size</div></div>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    var A = 'M20 20 H150 A20 20 0 0 1 150 60 H110 L96 74 H168 A16 16 0 0 1 184 90 V94 A16 16 0 0 1 168 110 H40 A20 20 0 0 1 20 90 V64 L44 48 L20 32 Z';
    var B = 'M24 20 H196 V60 H140 L124 44 L108 60 V100 H196 V108 H36 A16 16 0 0 1 20 92 V36 A16 16 0 0 1 24 20 Z';
    var C = 'M20 20 H120 L150 40 H196 V100 H150 L120 80 L90 110 H36 A16 16 0 0 1 20 94 Z';
    var rows = [
      ['Winter Carpet Layout 3', 'Approved', 'by yeti · Misfits Main Hall · revision 4', '38.4 m', '12', '22 × 12 m', A],
      ['Club Night Tight Technical', 'Approved', 'by dubboy · Misfits Main Hall · revision 2', '31.9 m', '14', '22 × 12 m', B],
      ['Regional Round 2 Flowing', 'Submitted', 'by winston · Misfits Main Hall · revision 1', '42.7 m', '11', '22 × 12 m', C],
      ['Village Hall Shortie', 'Approved', 'by yeti · Hathersage Village Hall · revision 3', '24.1 m', '9', '14 × 8 m', B],
      ['Christmas Cracker', 'Draft', 'by dubboy · Misfits Main Hall · revision 6', '36.0 m', '13', '22 × 12 m', A],
      ['Practice Night Basic Oval Plus', 'Approved', 'by soar-committee · SOAR Hall · revision 1', '28.8 m', '8', '18 × 10 m', C]
    ];
    return { tracks: rows.map(function (r) { return { name: r[0], approved: r[1] === 'Approved', submitted: r[1] === 'Submitted', draft: r[1] === 'Draft', meta: r[2], lap: r[3], corners: r[4], size: r[5], path: r[6] }; }) };
  }
}
</script>
</body>
</html>

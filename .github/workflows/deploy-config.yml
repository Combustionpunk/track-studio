# Validates the production deploy files (compose config, Caddyfile, backup wrapper) and runs the server's
# deploy tests (health check, S3 signing, backup/restore against a local S3 stub, deploy config).
name: Deploy config

on:
  pull_request:
    paths: [docker-compose.prod.yml, deploy/**, .env.example, docs/deploy.md, apps/server/src/**, apps/server/test/**, .github/workflows/deploy-config.yml]
  push:
    branches: [main]
    paths: [docker-compose.prod.yml, deploy/**, .env.example, docs/deploy.md, apps/server/src/**, apps/server/test/**, .github/workflows/deploy-config.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config --quiet
      - name: caddy validate
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: backup.sh syntax
        run: bash -n deploy/backup.sh

  server-deploy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - working-directory: apps/server
        run: pnpm exec vitest run test/health.test.ts test/s3.test.ts test/backup.test.ts test/deploy.test.ts

# Browser tests (Playwright) for the web app: tablet touch and desktop mouse in the designer, the 3D viewer, build
# sheets. They start Vite alone (no API server); see apps/web/playwright.config.ts. One spec, private-drafts (#175),
# starts apps/server itself, so server changes run them too. Added to CI by #119, which needed the touch long-press
# tests to run on every PR. No secrets; only the repo's own code runs.
name: E2E

on:
  pull_request:
    paths: [apps/web/**, apps/server/**, packages/engine/**, package.json, pnpm-workspace.yaml, pnpm-lock.yaml, tsconfig.base.json, .github/workflows/e2e.yml]
  push:
    branches: [main]
    paths: [apps/web/**, apps/server/**, packages/engine/**, package.json, pnpm-workspace.yaml, pnpm-lock.yaml, tsconfig.base.json, .github/workflows/e2e.yml]

# One group per PR, so a new push cancels the run it supersedes. Pushes to main share one group and never cancel the
# run in progress, so results on main arrive in commit order. GitHub keeps only one waiting run per group: if several
# merges land while a run is going, the newest waits and the ones in between are cancelled, so the latest commit on
# main always gets a result (#142).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's Playwright image: Node and the browsers with their system libraries, so there's no apt step (the
    # runner's apt mirrors failed to resolve on the first runs). Its version must match @playwright/test in
    # apps/web/package.json; bump both together.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      # the image's Node has no corepack: install the pnpm that package.json pins
      - run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")" && pnpm install --frozen-lockfile
      - name: Playwright
        working-directory: apps/web
        run: pnpm test:e2e
      - name: Keep the failures' traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: node_modules/.e2e-results/
          retention-days: 7
          if-no-files-found: ignore
